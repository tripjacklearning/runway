<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>TripJack · Room Booking</title>

<!-- Google Sign-In -->
<script src="https://accounts.google.com/gsi/client" async defer></script>

<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Mono:wght@400;500&display=swap');

  /* ── Design tokens ──────────────────────────────────────── */
  :root {
    --bg:        #F5F4F0;
    --surface:   #FFFFFF;
    --border:    #E2E0D9;
    --text:      #1A1916;
    --muted:     #7A7870;
    --accent:    #1D3C6E;      /* TripJack navy */
    --accent2:   #E8762B;      /* warm orange */
    --danger:    #C0392B;
    --free:      #D4EDDA;
    --free-text: #155724;
    --busy:      #FFE0DC;
    --busy-text: #7A1C14;
    --radius:    10px;
    --shadow:    0 2px 12px rgba(0,0,0,.07);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    font-size: 14px;
  }

  /* ── Top bar ────────────────────────────────────────────── */
  header {
    background: var(--accent);
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 28px;
    height: 56px;
    position: sticky;
    top: 0;
    z-index: 100;
    box-shadow: 0 2px 8px rgba(0,0,0,.18);
  }
  .logo { font-size: 15px; font-weight: 600; letter-spacing: .4px; display: flex; align-items: center; gap: 10px; }
  .logo svg { opacity: .85; }
  .user-pill {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; opacity: .88;
  }
  .user-pill img { width: 28px; height: 28px; border-radius: 50%; border: 2px solid rgba(255,255,255,.3); }
  #btn-signout {
    background: rgba(255,255,255,.15); border: none; color: #fff;
    font-family: inherit; font-size: 12px; padding: 4px 10px;
    border-radius: 5px; cursor: pointer; margin-left: 6px;
  }
  #btn-signout:hover { background: rgba(255,255,255,.25); }

  /* ── Auth screen ────────────────────────────────────────── */
  #auth-screen {
    display: flex; align-items: center; justify-content: center;
    min-height: calc(100vh - 56px);
  }
  .auth-card {
    background: var(--surface); border-radius: 16px;
    box-shadow: var(--shadow); padding: 48px 56px; text-align: center;
    max-width: 380px; width: 90%;
  }
  .auth-card h2 { font-size: 22px; font-weight: 600; margin-bottom: 8px; }
  .auth-card p  { color: var(--muted); margin-bottom: 28px; font-size: 13px; line-height: 1.6; }
  .auth-note { font-size: 11px; color: var(--muted); margin-top: 20px; }

  /* ── Main layout ────────────────────────────────────────── */
  #app { display: none; max-width: 1200px; margin: 0 auto; padding: 28px 20px; }

  /* ── Date picker bar ───────────────────────────────────── */
  .date-bar {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 24px; flex-wrap: wrap;
  }
  .date-bar label { font-size: 13px; font-weight: 500; color: var(--muted); }
  .date-bar input[type=date] {
    border: 1.5px solid var(--border); border-radius: var(--radius);
    padding: 8px 12px; font-family: inherit; font-size: 14px;
    background: var(--surface); color: var(--text); cursor: pointer;
  }
  .date-bar input:focus { outline: 2px solid var(--accent); border-color: transparent; }
  .btn-today {
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: var(--radius); padding: 8px 14px; font-family: inherit;
    font-size: 13px; cursor: pointer; color: var(--accent); font-weight: 500;
  }
  .btn-today:hover { background: var(--bg); }
  .floor-toggle { display: flex; gap: 6px; margin-left: auto; }
  .floor-btn {
    border: 1.5px solid var(--border); background: var(--surface);
    border-radius: 20px; padding: 6px 14px; font-family: inherit;
    font-size: 12px; cursor: pointer; color: var(--muted); font-weight: 500;
    transition: all .15s;
  }
  .floor-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }

  /* ── Room grid ──────────────────────────────────────────── */
  .section-title {
    font-size: 11px; font-weight: 600; letter-spacing: 1.2px;
    text-transform: uppercase; color: var(--muted); margin: 20px 0 10px;
  }
  .room-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 14px;
  }
  .room-card {
    background: var(--surface); border: 1.5px solid var(--border);
    border-radius: 12px; overflow: hidden;
    transition: box-shadow .15s, transform .1s;
  }
  .room-card:hover { box-shadow: var(--shadow); transform: translateY(-1px); }

  .room-header {
    padding: 14px 16px 10px;
    display: flex; align-items: flex-start; justify-content: space-between;
  }
  .room-name { font-size: 15px; font-weight: 600; }
  .room-meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  .cap-badge {
    font-size: 11px; font-weight: 500; font-family: 'DM Mono', monospace;
    background: var(--bg); border: 1px solid var(--border);
    padding: 2px 8px; border-radius: 20px; white-space: nowrap;
  }

  /* Timeline */
  .timeline {
    padding: 0 16px 14px;
  }
  .tl-label { font-size: 10px; color: var(--muted); font-family: 'DM Mono', monospace; display: flex; justify-content: space-between; margin-bottom: 4px; }
  .tl-track {
    position: relative; height: 22px; background: var(--free);
    border-radius: 4px; overflow: visible;
  }
  .tl-block {
    position: absolute; top: 0; height: 100%;
    background: var(--accent); border-radius: 3px;
    transition: opacity .1s; cursor: default;
  }
  .tl-block:hover { opacity: .8; }
  .tl-block.mine { background: var(--accent2); }

  .slots-list { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
  .slot-row {
    display: flex; align-items: center; justify-content: space-between;
    font-size: 12px; padding: 5px 0;
    border-bottom: 1px solid var(--border);
  }
  .slot-row:last-child { border: none; }
  .slot-time { font-family: 'DM Mono', monospace; color: var(--text); font-size: 11px; }
  .slot-who  { color: var(--muted); font-size: 11px; max-width: 120px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .btn-cancel {
    font-size: 10px; padding: 2px 8px; border-radius: 4px; cursor: pointer;
    background: var(--busy); color: var(--busy-text); border: none; font-family: inherit;
  }
  .btn-cancel:hover { opacity: .75; }

  .no-bookings { font-size: 12px; color: var(--free-text); background: var(--free); padding: 6px 10px; border-radius: 6px; text-align: center; }

  /* Book button */
  .btn-book {
    width: 100%; margin: 10px 16px 14px; width: calc(100% - 32px);
    background: var(--accent); color: #fff; border: none;
    border-radius: 8px; padding: 9px; font-family: inherit; font-size: 13px;
    font-weight: 500; cursor: pointer; transition: background .15s;
  }
  .btn-book:hover { background: #162e57; }
  .btn-book:disabled { background: var(--border); color: var(--muted); cursor: default; }

  /* ── Modal ──────────────────────────────────────────────── */
  .modal-overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,.35); z-index: 200;
    align-items: center; justify-content: center;
  }
  .modal-overlay.open { display: flex; }
  .modal {
    background: var(--surface); border-radius: 14px;
    padding: 28px 28px 22px; width: 400px; max-width: 95vw;
    box-shadow: 0 8px 32px rgba(0,0,0,.18);
    animation: slideUp .2s ease;
  }
  @keyframes slideUp { from { transform: translateY(16px); opacity: 0; } to { transform: none; opacity: 1; } }
  .modal h3 { font-size: 17px; font-weight: 600; margin-bottom: 18px; }
  .modal h3 span { color: var(--accent); }
  .form-row { margin-bottom: 14px; }
  .form-row label { display: block; font-size: 12px; font-weight: 500; color: var(--muted); margin-bottom: 5px; }
  .form-row input, .form-row select, .form-row textarea {
    width: 100%; border: 1.5px solid var(--border); border-radius: 8px;
    padding: 9px 11px; font-family: inherit; font-size: 14px; color: var(--text);
    background: var(--surface); transition: border .15s;
  }
  .form-row input:focus, .form-row select:focus, .form-row textarea:focus {
    outline: none; border-color: var(--accent);
  }
  .time-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 18px; }
  .btn-primary {
    flex: 1; background: var(--accent); color: #fff; border: none;
    border-radius: 8px; padding: 10px; font-family: inherit; font-size: 14px;
    font-weight: 500; cursor: pointer;
  }
  .btn-primary:hover { background: #162e57; }
  .btn-secondary {
    flex: 1; background: var(--bg); color: var(--text); border: 1.5px solid var(--border);
    border-radius: 8px; padding: 10px; font-family: inherit; font-size: 14px; cursor: pointer;
  }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: var(--text); color: #fff; padding: 10px 20px;
    border-radius: 8px; font-size: 13px; z-index: 500;
    opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }
  .toast.error { background: var(--danger); }
  .toast.success { background: #1a7a3a; }

  /* ── Access denied ──────────────────────────────────────── */
  #denied-screen {
    display: none; align-items: center; justify-content: center;
    min-height: calc(100vh - 56px);
  }
  .denied-card {
    background: var(--surface); border-radius: 14px; box-shadow: var(--shadow);
    padding: 40px; text-align: center; max-width: 380px;
  }
  .denied-card h2 { font-size: 20px; margin-bottom: 10px; }
  .denied-card p  { color: var(--muted); font-size: 13px; line-height: 1.6; }

  /* ── Loading ────────────────────────────────────────────── */
  .spinner { display: inline-block; width: 18px; height: 18px; border: 2px solid #ccc; border-top-color: var(--accent); border-radius: 50%; animation: spin .6s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  #loading-overlay {
    position: fixed; inset: 0; background: rgba(245,244,240,.7);
    display: none; align-items: center; justify-content: center; z-index: 300;
  }
  #loading-overlay.show { display: flex; }
</style>
</head>
<body>

<!-- ─ Header ─────────────────────────────────────────────── -->
<header>
  <div class="logo">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <rect x="3" y="4" width="18" height="16" rx="2"/><path d="M8 2v4M16 2v4M3 10h18"/>
    </svg>
    TripJack · Conference Rooms
  </div>
  <div class="user-pill" id="user-pill" style="display:none">
    <img id="user-avatar" src="" alt=""/>
    <span id="user-name"></span>
    <button id="btn-signout">Sign out</button>
  </div>
</header>

<!-- ─ Auth screen ─────────────────────────────────────────── -->
<div id="auth-screen">
  <div class="auth-card">
    <h2>Room Booking</h2>
    <p>Sign in with your TripJack Google account to check room availability and make bookings.</p>
    <div id="g_id_onload"
      data-client_id="YOUR_GOOGLE_CLIENT_ID"
      data-callback="handleCredential"
      data-auto_prompt="false">
    </div>
    <div class="g_id_signin"
      data-type="standard"
      data-size="large"
      data-theme="outline"
      data-text="signin_with"
      data-shape="rectangular"
      data-logo_alignment="left">
    </div>
    <p class="auth-note">Only @tripjack.com accounts are permitted.</p>
  </div>
</div>

<!-- ─ Denied screen ───────────────────────────────────────── -->
<div id="denied-screen">
  <div class="denied-card">
    <h2>Access Restricted</h2>
    <p id="denied-msg">Bookings are currently restricted. Please contact the receptionist to make a booking.</p>
    <br/>
    <button class="btn-secondary" onclick="signOut()" style="width:100%;border-radius:8px;padding:10px;font-family:inherit;cursor:pointer;">Sign out</button>
  </div>
</div>

<!-- ─ Main app ─────────────────────────────────────────────── -->
<div id="app">

  <!-- Date bar -->
  <div class="date-bar">
    <label>Viewing date</label>
    <input type="date" id="date-picker" />
    <button class="btn-today" onclick="goToday()">Today</button>
    <div class="floor-toggle">
      <button class="floor-btn active" data-floor="all" onclick="setFloor(this)">All floors</button>
      <button class="floor-btn" data-floor="Ground" onclick="setFloor(this)">Ground</button>
      <button class="floor-btn" data-floor="First" onclick="setFloor(this)">First</button>
    </div>
  </div>

  <div id="rooms-container"></div>
</div>

<!-- ─ Booking modal ───────────────────────────────────────── -->
<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <h3>Book <span id="modal-room-name"></span></h3>
    <div class="form-row">
      <label>Date</label>
      <input type="date" id="modal-date" />
    </div>
    <div class="form-row time-row">
      <div>
        <label>Start time</label>
        <input type="time" id="modal-start" step="900" />
      </div>
      <div>
        <label>End time</label>
        <input type="time" id="modal-end" step="900" />
      </div>
    </div>
    <div class="form-row">
      <label>Purpose / Meeting name</label>
      <input type="text" id="modal-purpose" placeholder="e.g. Team standup, Client call…" />
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeModal()">Cancel</button>
      <button class="btn-primary" onclick="submitBooking()">Confirm Booking</button>
    </div>
  </div>
</div>

<!-- ─ Loading overlay ─────────────────────────────────────── -->
<div id="loading-overlay"><div class="spinner"></div></div>

<!-- ─ Toast ───────────────────────────────────────────────── -->
<div class="toast" id="toast"></div>

<script>
// ╔══════════════════════════════════════════════════════════╗
// ║  CONFIG — update these two lines                        ║
// ╚══════════════════════════════════════════════════════════╝
const GAS_URL    = "https://script.google.com/macros/s/AKfycbw20AlQYUOaikWj0_XEDvCHrZ_dZzUNel-0rVtVmZJvk-IrCFe5efYAt-0sWfi_NwRH/exec"; // paste after deploying Code.gs
const CLIENT_ID  = "730132317756-clg8e41cr3irtivl9vacuedhnjmql3uk.apps.googleusercontent.com";        // from Google Cloud Console

// ── Room master (mirrors Code.gs) ──────────────────────────
const ROOMS = [
  { name: "Terminal 1", floor: "Ground", capacity: 4 },
  { name: "Terminal 2", floor: "Ground", capacity: 4 },
  { name: "Terminal 3", floor: "Ground", capacity: 10 },
  { name: "London",     floor: "First",  capacity: 16 },
  { name: "C5",         floor: "First",  capacity: 5 },
  { name: "C6",         floor: "First",  capacity: 5 },
  { name: "C7",         floor: "First",  capacity: 4 },
  { name: "C8",         floor: "First",  capacity: 4 },
  { name: "C9",         floor: "First",  capacity: 4 },
  { name: "C10",        floor: "First",  capacity: 4 },
];

// ── State ───────────────────────────────────────────────────
let currentUser   = null;   // { email, name, picture }
let canBook       = false;
let activeFloor   = "all";
let bookingsCache = [];     // for selected date

// ── Helpers ─────────────────────────────────────────────────
const $ = id => document.getElementById(id);

function showLoading(v) { $('loading-overlay').classList.toggle('show', v); }

function toast(msg, type = '') {
  const el = $('toast');
  el.textContent = msg;
  el.className = 'toast show' + (type ? ' ' + type : '');
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 3000);
}

function toMinutes(t) {
  const [h, m] = t.split(':').map(Number);
  return h * 60 + m;
}

function formatTime(t) {
  const [h, m] = t.split(':').map(Number);
  const ampm = h >= 12 ? 'PM' : 'AM';
  return `${h % 12 || 12}:${m.toString().padStart(2,'0')} ${ampm}`;
}

// Timeline: office 8 AM–10 PM = 840 min window starting at 480
const TL_START = 8 * 60;   // 480
const TL_END   = 22 * 60;  // 1320
const TL_RANGE = TL_END - TL_START;

function slotToPercent(t) {
  const m = toMinutes(t);
  return Math.max(0, Math.min(100, ((m - TL_START) / TL_RANGE) * 100));
}

// ── Auth ─────────────────────────────────────────────────────
function handleCredential(response) {
  const payload = parseJwt(response.credential);
  if (!payload.email.endsWith('@tripjack.com')) {
    toast('Only @tripjack.com accounts allowed.', 'error');
    return;
  }
  currentUser = { email: payload.email, name: payload.name, picture: payload.picture };
  onSignedIn();
}

function parseJwt(token) {
  const b64 = token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
  return JSON.parse(atob(b64));
}

async function onSignedIn() {
  // Show user pill
  $('user-pill').style.display = 'flex';
  $('user-name').textContent = currentUser.name.split(' ')[0];
  $('user-avatar').src = currentUser.picture;

  showLoading(true);
  try {
    const r = await fetch(`${GAS_URL}?action=checkAccess&email=${encodeURIComponent(currentUser.email)}`);
    const data = await r.json();
    canBook = data.data?.allowed || false;
  } catch(e) {
    // If GAS_URL not set yet, default to view-only
    canBook = false;
  }
  showLoading(false);

  $('auth-screen').style.display = 'none';
  if (!canBook) {
    $('denied-screen').style.display = 'flex';
    // Still show the app in read-only if you want everyone to VIEW
    // Comment the line below to allow all @tripjack.com to at least view
    return;
  }

  showApp();
}

function signOut() {
  currentUser = null; canBook = false;
  $('user-pill').style.display = 'none';
  $('app').style.display = 'none';
  $('denied-screen').style.display = 'none';
  $('auth-screen').style.display = 'flex';
  google.accounts.id.disableAutoSelect();
}
$('btn-signout').onclick = signOut;

// ── App init ─────────────────────────────────────────────────
function showApp() {
  $('app').style.display = 'block';
  goToday();
}

function goToday() {
  const d = new Date();
  const iso = d.toISOString().split('T')[0];
  $('date-picker').value = iso;
  loadDay(iso);
}

$('date-picker').onchange = e => loadDay(e.target.value);

function setFloor(btn) {
  document.querySelectorAll('.floor-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  activeFloor = btn.dataset.floor;
  renderRooms();
}

async function loadDay(date) {
  showLoading(true);
  try {
    const r = await fetch(`${GAS_URL}?action=bookings&date=${date}`);
    const data = await r.json();
    bookingsCache = data.ok ? data.data : [];
  } catch(e) {
    bookingsCache = [];
  }
  showLoading(false);
  renderRooms();
}

// ── Render rooms ─────────────────────────────────────────────
function renderRooms() {
  const container = $('rooms-container');
  container.innerHTML = '';

  const floors = ['Ground', 'First'];
  floors.forEach(floor => {
    if (activeFloor !== 'all' && activeFloor !== floor) return;

    const rooms = ROOMS.filter(r => r.floor === floor);
    const section = document.createElement('div');
    section.innerHTML = `<div class="section-title">${floor} Floor</div><div class="room-grid" id="grid-${floor}"></div>`;
    container.appendChild(section);
    const grid = section.querySelector('.room-grid');
    rooms.forEach(room => grid.appendChild(buildRoomCard(room)));
  });
}

function buildRoomCard(room) {
  const bookings = bookingsCache.filter(b => b.roomName === room.name);
  const card = document.createElement('div');
  card.className = 'room-card';

  // Header
  const header = document.createElement('div');
  header.className = 'room-header';
  header.innerHTML = `
    <div>
      <div class="room-name">${room.name}</div>
      <div class="room-meta">${room.floor} Floor</div>
    </div>
    <span class="cap-badge">👥 ${room.capacity}</span>
  `;
  card.appendChild(header);

  // Timeline track
  const tl = document.createElement('div');
  tl.className = 'timeline';
  tl.innerHTML = `
    <div class="tl-label"><span>8 AM</span><span>1 PM</span><span>10 PM</span></div>
    <div class="tl-track" id="track-${room.name.replace(/\s/g,'-')}"></div>
  `;
  card.appendChild(tl);
  const track = tl.querySelector('.tl-track');

  bookings.forEach(b => {
    const left  = slotToPercent(b.startTime);
    const right = slotToPercent(b.endTime);
    const block = document.createElement('div');
    block.className = 'tl-block' + (b.bookedBy === currentUser?.email ? ' mine' : '');
    block.style.left  = left + '%';
    block.style.width = (right - left) + '%';
    block.title = `${formatTime(b.startTime)}–${formatTime(b.endTime)}: ${b.purpose || b.bookedByName}`;
    track.appendChild(block);
  });

  // Booking list
  const list = document.createElement('div');
  list.className = 'slots-list';
  list.style.padding = '0 16px';

  if (bookings.length === 0) {
    list.innerHTML = '<div class="no-bookings">Free all day</div>';
  } else {
    bookings.sort((a,b) => a.startTime.localeCompare(b.startTime)).forEach(b => {
      const row = document.createElement('div');
      row.className = 'slot-row';
      const isMine = b.bookedBy === currentUser?.email;
      row.innerHTML = `
        <span class="slot-time">${formatTime(b.startTime)}–${formatTime(b.endTime)}</span>
        <span class="slot-who" title="${b.bookedByName || b.bookedBy}">${b.purpose || (b.bookedByName || b.bookedBy.split('@')[0])}</span>
        ${(isMine || canBook) ? `<button class="btn-cancel" onclick="cancelBooking('${b.bookingId}','${room.name}')">Cancel</button>` : ''}
      `;
      list.appendChild(row);
    });
  }
  card.appendChild(list);

  // Book button
  if (canBook) {
    const btn = document.createElement('button');
    btn.className = 'btn-book';
    btn.textContent = '+ Book this room';
    btn.onclick = () => openModal(room.name);
    card.appendChild(btn);
  }

  return card;
}

// ── Modal ─────────────────────────────────────────────────────
let modalRoom = '';

function openModal(roomName) {
  modalRoom = roomName;
  $('modal-room-name').textContent = roomName;
  $('modal-date').value = $('date-picker').value;
  $('modal-start').value = '09:00';
  $('modal-end').value   = '10:00';
  $('modal-purpose').value = '';
  $('modal-overlay').classList.add('open');
}

function closeModal() {
  $('modal-overlay').classList.remove('open');
}

$('modal-overlay').addEventListener('click', e => {
  if (e.target === $('modal-overlay')) closeModal();
});

// GAS does not support JSON POST from browser (CORS preflight is blocked).
// All writes are sent as GET requests with query parameters instead.
async function gasGet(params) {
  const qs = new URLSearchParams(params).toString();
  const r = await fetch(`${GAS_URL}?${qs}`, { redirect: 'follow' });
  return r.json();
}

async function submitBooking() {
  const date      = $('modal-date').value;
  const startTime = $('modal-start').value;
  const endTime   = $('modal-end').value;
  const purpose   = $('modal-purpose').value.trim();

  if (!startTime || !endTime) { toast('Please set start and end times.', 'error'); return; }
  if (toMinutes(endTime) <= toMinutes(startTime)) { toast('End time must be after start time.', 'error'); return; }

  showLoading(true);
  closeModal();
  try {
    const data = await gasGet({
      action:      'book',
      roomName:    modalRoom,
      date, startTime, endTime, purpose,
      bookedBy:    currentUser.email,
      bookedByName: currentUser.name,
    });
    if (data.ok) {
      toast(`Booked! ${modalRoom} ${formatTime(startTime)}–${formatTime(endTime)}`, 'success');
      await loadDay(date);
    } else {
      toast(data.error || 'Booking failed.', 'error');
    }
  } catch(e) {
    toast('Booking failed: ' + e.message, 'error');
  }
  showLoading(false);
}

async function cancelBooking(bookingId, roomName) {
  if (!confirm(`Cancel this booking for ${roomName}?`)) return;
  showLoading(true);
  try {
    const data = await gasGet({
      action: 'cancel', bookingId, requestedBy: currentUser.email
    });
    if (data.ok) {
      toast('Booking cancelled.', 'success');
      await loadDay($('date-picker').value);
    } else {
      toast(data.error || 'Could not cancel.', 'error');
    }
  } catch(e) {
    toast('Cancel failed: ' + e.message, 'error');
  }
  showLoading(false);
}
</script>
